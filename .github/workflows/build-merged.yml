name: Build Merged Jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download and run NFRT
        run: |
          curl -L -o nfrt.jar https://maven.neoforged.net/releases/net/neoforged/neoform-runtime/1.0.33/neoform-runtime-1.0.33.jar
          mkdir -p out
          java -jar nfrt.jar --neoforge net.neoforged:neoforge:21.1.252:userdev --dist client --output out
          echo "=== RESULT FILES ==="
          find ./out -type f -exec ls -la {} \;

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: merged-jar
          path: out/
