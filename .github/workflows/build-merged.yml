name: Build Merged Jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download and run NeoForge installer
        run: |
          curl -L -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.252/neoforge-21.1.252-installer.jar
          mkdir -p out
          java -jar installer.jar --installServer ./out
          echo "=== ALL JARS (sorted by size) ==="
          find ./out -name "*.jar" -exec ls -la {} \; | sort -k5 -n -r | head -30

      - name: Find and rename merged jar
        run: |
          MERGED=$(find ./out -name "*merged*.jar" | head -1)
          echo "Found merged jar: $MERGED"
          if [ -z "$MERGED" ]; then
            echo "No merged jar found, listing all jars:"
            find ./out -name "*.jar" -exec ls -la {} \;
            exit 1
          fi
          cp "$MERGED" ./merged.jar
          ls -la ./merged.jar

      - name: Upload merged jar only
        uses: actions/upload-artifact@v4
        with:
          name: merged-jar
          path: merged.jar
