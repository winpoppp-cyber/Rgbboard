name: Build Merged Jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download and run NeoForge installer
        run: |
          curl -L -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.252/neoforge-21.1.252-installer.jar
          mkdir -p out
          java -jar installer.jar --installServer ./out
          find ./out -name "*.jar" | head -50

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jars
          path: out/libraries/net/neoforged/neoforge/21.1.252/
