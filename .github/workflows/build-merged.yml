name: Build Merged Jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Minimal Gradle Project
        run: |
          mkdir -p temp_project
          cd temp_project
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          plugins {
              id 'net.neoforged.moddev' version '2.0.78'
          }
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'net.neoforged.moddev'
          }
          neoForge {
              version = "21.1.252"
          }
          // Task to copy the merged jar to a stable location
          tasks.register('copyMergedJar', Copy) {
              def mergedJar = neoForge.artifacts.minecraft
              from mergedJar
              into layout.buildDirectory.dir("output")
              rename { "minecraft-merged.jar" }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

      - name: Run Gradle Task to Generate Merged Jar
        run: |
          cd temp_project
          # This command triggers the NeoForm process to create the Minecraft artifacts
          # The 'copyMergedJar' task will then copy the final merged jar.
          gradle copyMergedJar --no-daemon

      - name: Upload Merged Jar
        uses: actions/upload-artifact@v4
        with:
          name: merged-jar
          path: temp_project/build/output/minecraft-merged.jar
